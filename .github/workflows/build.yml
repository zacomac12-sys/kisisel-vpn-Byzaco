name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android Build Tools kur
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: gradlew iznini ver
        run: chmod +x gradlew

      - name: APK derle
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KisiselVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
