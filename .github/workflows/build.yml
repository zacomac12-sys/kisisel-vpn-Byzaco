name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK lisanslarını kabul et ve bileşenleri indir
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7 indir
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            --output gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: APK derle
        run: |
          ./gradle-8.7/bin/gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KisiselVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
