name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle kur (wrapper JAR dahil)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: gradlew iznini ver
        run: chmod +x gradlew

      - name: APK derle
        run: gradle assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KisiselVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
